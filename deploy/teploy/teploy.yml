# libteca — one media server, every client (Jellyfin + Audiobookshelf + OPDS
# + Subsonic wire compatibility, so existing client apps connect unchanged).
#
# The image is published by the release workflow for linux/amd64 and
# linux/arm64. Create the first administrator before the first deploy:
#
#   teploy secret set LIBTECA_INIT_ADMIN 'admin:<password>'
#
# It is read only while the server has no users, so it can stay set.
#
# No /dev/dri: the teploy format has no device mapping, so
# LIBTECA_HWACCEL=auto degrades to software transcode in the container.
# Hardware transcode means the bare systemd path (deploy/README.md).
#
# Published in the teploy catalog as `libteca` (useteploy/templates):
#   name: libteca
#   description: One media server, every client - Jellyfin, Audiobookshelf,
#     OPDS, and Subsonic wire compatibility in one binary
#   accessories: []
#   variables: []
#
# No domain: raw port on the host, LAN/tailnet only (PLAN §11 — no public
# exposure by default). For Caddy in front of a LAN box, set a hostname and
# add tls: {internal: true}, or the ACME challenge can never complete.
#
# Behind Caddy (ingress: caddy, HTTPS only) also set, under env:
#   LIBTECA_SECURE_COOKIE: "true"
#   LIBTECA_TRUSTED_PROXIES: <subnet of the teploy docker network>
# The subnet comes from `docker network inspect teploy` (IPAM Subnet). Login
# lockouts then key on the real client from X-Forwarded-For instead of on
# Caddy. Leave both unset in this raw-port form: the port is plain HTTP, and
# with docker's userland proxy direct clients can arrive from the bridge
# gateway, so trusting that subnet here would let them forge their address.
#
# The image entrypoint starts the binary with `--data /data`, which is the
# teploy-managed volume below.
app: libteca
ingress: host
port: 8096
image: ghcr.io/libteca/libteca:stable
health:
  path: /healthcheck
  timeout_seconds: 60
env:
  LIBTECA_HWACCEL: auto
volumes:
  data: /data
volume_ownership:
  data:
    uid: 10001
    gid: 10001
    mode: "0700"
